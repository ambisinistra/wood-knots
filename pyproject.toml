[project]
name = "wood-knots"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.7.1",
    "numpy>=1.23.5",
    "onnx>=1.14.0",
    "onnxruntime>=1.15.1",
    "opencv-python>=4.6.0.66",
    "pyyaml>=6.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "tqdm>=4.65.0",
    "ultralytics>=8.3.0",
    "nvidia-nccl-cu12",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }